name: ci

# Everything the Go side promises: it formats, lints, tests on all three
# platforms, and cross-compiles every release target. Every step calls the
# same Makefile targets a developer runs locally (`make help` lists them), so
# local and CI behaviour cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Windows runners ship only MinGW make, which falls back to cmd.exe when
    # no POSIX shell is on PATH; a bash step gives it the sh.exe the recipes
    # below need.
    shell: bash

jobs:
  # Docs-only pull requests (READMEs, LICENSE, assets) skip the Go checks
  # below: `changes` classifies the PR and the jobs gate on its output.
  # readme-sync stays a separate workflow, so the README invariants are still
  # enforced on exactly those PRs. Pure git diff -- no API, no third-party
  # filter action -- and anything but a pull request reports docs_only=false,
  # so pushes to main always run the full pipeline the tag job needs.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      # The build matrix, generated by the Makefile so the cross-compile gate
      # and the release packager share one target list.
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only a pull request diffs against a base commit; any full clone
          # would otherwise be wasted. Strings, not numbers: `0` is falsy in
          # GitHub expressions, so `0 || 1` would silently fetch depth 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: detect docs-only pull request
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          # The PR's base tip at event time; correct even for outdated PRs.
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ] && files="$(git -c core.quotePath=false diff --name-only --no-renames "$PR_BASE" HEAD)"; then
            docs_only=true
            while IFS= read -r f; do
              case "$f" in
                ""|README.md|README.pl.md|LICENSE|assets/*) ;;
                *) docs_only=false; break ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: release target matrix
        id: matrix
        run: echo "targets=$(make release-target-matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    # An unset docs_only (filter error) is != 'true', so classification
    # problems still run the tests; !cancelled() removes the implicit
    # success() gate, so a red `changes` job runs these checks instead of
    # skipping them -- skipped checks report success to required checks.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: test
        run: make test

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # Windows checkouts can carry CRLF endings, so formatting is checked
        # here, on one platform, instead of inside the test matrix.
        run: make fmt-check

      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: golangci-lint
        run: make lint

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A gate only: every merge ships its binaries from the tag job below,
      # which knows the version to stamp (see the comment there) and runs the
      # same cross-compile, so this redundant pass is skipped on a push.
      - name: cross-compile
        if: github.event_name != 'push'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make build-dist

  tag:
    name: tag (${{ github.ref_name }})
    # Only push events create releases: a workflow_dispatch on main would
    # re-publish unchanged code under a new version (README, Quality table).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: [test, lint, build]
    # Serialize releases: two quick merges would otherwise compute the same
    # next tag from the same fetched tags and the second publish would fail.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    # The freshly published tag, handed over to the docker and homebrew jobs.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Version bumps follow the *merged PR's* labels: squash merges carry the
      # pull request as the subject suffix (#N), merge commits as a leading
      # "Merge pull request #N" line, and that PR's labels decide patch,
      # minor or major (see scripts/next_tag.py). A push without a PR number,
      # or without a release label, falls back to a patch bump. A tag push
      # does not re-trigger this workflow since the `push` trigger filters on
      # branches only.
      - name: read merged PR labels
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(git log -1 --pretty=%s | grep -oE '\(#[0-9]+\)$' | tr -d '()#' || true)"
          if [ -z "$pr" ]; then
            pr="$(git log -1 --pretty=%B | grep -oE '^Merge pull request #[0-9]+' | head -1 | tr -dc '0-9' || true)"
          fi
          if [ -n "$pr" ]; then
            gh pr view "$pr" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/pr-labels" || true
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/pr-labels" ]; then
            labels="$(paste -sd, "$RUNNER_TEMP/pr-labels")"
            echo "labels=$labels" >> "$GITHUB_OUTPUT"
          fi

      # The tag is not created locally: `gh release create --target` below
      # creates it server-side as part of publishing, so a failure in any
      # step before that leaves no tag behind and a re-run recomputes the
      # same version instead of burning one.
      - name: compute next tag
        id: tag
        env:
          # Through env, never ${{ }} into the shell source: a label name is
          # attacker-influenced text and this step holds GH_TOKEN.
          LABELS: ${{ steps.pr.outputs.labels }}
        run: |
          tag="$(python3 scripts/next_tag.py --labels "$LABELS")"
          echo "new tag: $tag (labels: $LABELS)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The release assets are built here, not in the build matrix: only this
      # job knows the tag, so stamping through the Makefile's release-assets
      # target puts the exact vX.Y.Z into `--version` (a describe of the
      # pre-tag commit would leak the previous version). tarballs for the
      # Homebrew formula (prebuilt `url`s), the raw .exe kept for Windows
      # users.
      - name: build release binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CGO_ENABLED: "0"
        run: make release-assets VERSION="$TAG"

      # SHA256SUMS is both a release asset for humans and the input of the
      # homebrew job, which hashes nothing itself.
      - name: checksum release assets
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes release-assets/*

  # The image follows the tag, never precedes it: `needs: [tag]` means the
  # build runs only after test/lint/build went green and the vX.Y.Z tag was
  # published — and it is skipped together with the tag job on PRs. The build
  # itself lives in docker.yaml, called here because a tag created with
  # GITHUB_TOKEN fires no event (see the comment at the top of that file).
  docker:
    name: docker
    needs: [tag]
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  # The formula follows the release: `needs: [tag]` runs it only after the
  # vX.Y.Z release is published, and it is skipped together with the tag job
  # on PRs. It regenerates Formula/git-prev-branch.rb in the general-purpose
  # tap matbur/homebrew-tap (which can host formulas of other apps too) and
  # pushes only when something changed. The push authenticates with a deploy
  # key: GITHUB_TOKEN is scoped to this repository and cannot write to
  # another one (README, "Installation -> Homebrew").
  homebrew:
    name: homebrew
    needs: [tag]
    runs-on: ubuntu-26.04
    # The release group is shared with the tag job, so two quick merges
    # cannot push to the tap concurrently (the loser would be rejected as
    # non-fast-forward) and the newer formula is always pushed last.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Only the checksum file travels between jobs: it was written by the
      # tag job and published together with the tarballs it describes.
      - name: download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"

      - name: checkout the tap
        uses: actions/checkout@v7
        with:
          repository: matbur/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: update the formula
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          python3 scripts/update_homebrew_formula.py \
            --name git-prev-branch \
            --repo matbur/git-prev-branch \
            --desc "Determine the previous git branch you switched from" \
            --homepage https://github.com/matbur/git-prev-branch \
            --tag "$TAG" \
            --shas "$RUNNER_TEMP/SHA256SUMS" \
            --tap-dir tap

      - name: commit and push
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        working-directory: tap
        # --porcelain catches a formula that does not exist yet, which
        # `git diff --quiet` would silently report as "no changes".
        run: |
          if [ -z "$(git status --porcelain -- Formula/git-prev-branch.rb)" ]; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-prev-branch.rb
          git commit -m "git-prev-branch $TAG"
          git push
