name: ci

# Everything the Go side promises: it formats, vets, lints, tests on all three
# platforms, and cross-compiles every release target. Every step calls the
# same Makefile targets a developer runs locally (`make help` lists them), so
# local and CI behaviour cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Windows runners ship only MinGW make, which falls back to cmd.exe when
    # no POSIX shell is on PATH; a bash step gives it the sh.exe the recipes
    # below need.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: vet
        run: make vet

      - name: test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        # Windows checkouts can carry CRLF endings, so formatting is checked
        # here, on one platform, instead of inside the test matrix.
        run: make fmt-check

      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: golangci-lint
        run: make lint

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          make build-dist
          # Rename to a platform-qualified binary so every release asset name
          # is unique; gh release create 404s on same-named assets.
          if [ "$GOOS" = "windows" ]; then
            mv dist/git-prev-branch.exe "dist/git-prev-branch-${GOOS}-${GOARCH}.exe"
          else
            mv dist/git-prev-branch "dist/git-prev-branch-${GOOS}-${GOARCH}"
          fi

      # Each matrix cell uploads its single binary; the tag job later
      # reassembles all six into the Release published on the new tag.
      - name: upload binary
        uses: actions/upload-artifact@v7
        with:
          name: git-prev-branch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/git-prev-branch*

  tag:
    name: tag (${{ github.ref_name }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Version bumps follow the *merged PR's* labels: the merge commit
      # message names the pull request (#N), whose labels decide patch, minor
      # or major (see scripts/next_tag.py). A push without a PR number, or
      # without a release label, falls back to a patch bump. A tag push does
      # not re-trigger this workflow since the `push` trigger filters on
      # branches only.
      - name: read merged PR labels
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | tail -1 | tr -d '#')"
          if [ -n "$pr" ]; then
            gh pr view "$pr" --json labels --jq '.labels[].name' > "$RUNNER_TEMP/pr-labels" || true
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/pr-labels" ]; then
            labels="$(paste -sd, "$RUNNER_TEMP/pr-labels")"
            echo "labels=$labels" >> "$GITHUB_OUTPUT"
          fi

      - name: create next tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels="${{ steps.pr.outputs.labels }}"
          tag="$(python3 scripts/next_tag.py --labels "$labels")"
          echo "new tag: $tag (labels: $labels)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release $tag"
          git push origin "$tag"

      # The binaries from the build job become the assets of a Release on the
      # new tag, so every merge ships runnable artifacts (see README, Install).
      - name: download built binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag }}" --generate-notes release-assets/*/*
