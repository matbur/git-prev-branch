name: docker

# Publishes the Docker Hub image so nobody has to build it themselves
# (README, "Installation -> Docker"). Two tags are pushed for every vX.Y.Z
# release: `latest` and the version itself.
#
# The build runs only for a git tag. The tag job in ci.yaml creates that tag
# via `gh release create` only after test/lint/build succeeded on main, so a
# green CI is exactly what starts this workflow: no ci, no tag, no image.
# `gh release create` makes the tag server-side, which fires the `create`
# event rather than `push`, hence the trigger here (a git-pushed tag creates
# the ref too, so no event is missed).

on:
  create:

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    # A branch creation is not a release; only tags build.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Newer BuildKit, needed for the multi-platform manifest.
      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      # The arm64 variant is emulated on the amd64 runner.
      - name: set up qemu
        uses: docker/setup-qemu-action@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version stamped with -X main.version, exactly like `make build`:
      # on a tag trigger it is the tag name itself.
      - name: resolve version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=$REF_NAME"
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      # The matching docker tag: the version, sanitised (a hand-made tag may
      # contain characters docker does not accept, e.g. a slash). Keep case
      # folding + invalid-character replacement only: `v1.0.5` must keep its
      # dots.
      - name: compute tag suffix
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          suffix="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+##; s#-+$##')"
          echo "suffix=$suffix"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            matbur/git-prev-branch:latest
            matbur/git-prev-branch:${{ steps.tag.outputs.suffix }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
