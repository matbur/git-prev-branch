name: docker

# Publishes the Docker Hub image so nobody has to build it themselves
# (README, "Installation -> Docker"). Two tags are pushed for every vX.Y.Z
# release: `latest` and the version itself.
#
# The build runs only for a git tag, in two ways:
#   * workflow_call — ci.yaml's docker job, which needs the tag job; the tag
#     job creates the vX.Y.Z tag via `gh release create` only after
#     test/lint/build succeeded on main, so a green CI is exactly what ships
#     the image. The call is needed because `gh release create` makes the tag
#     with GITHUB_TOKEN, and events created by that token never start a
#     workflow run — a `create` trigger alone would never see CI tags.
#   * create — a tag pushed by hand (own credentials do fire the event);
#     branch creations are filtered out by the job's `if`.

on:
  workflow_call:
    inputs:
      version:
        description: Git tag (vX.Y.Z) the image is built from.
        required: true
        type: string
  create:

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    # A branch creation is not a release; only tags build. That filter is
    # needed for `create` alone: a workflow_call runs on the caller's branch
    # ref (the merge commit on main that the tag job just tagged).
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Newer BuildKit, needed for the multi-platform manifest.
      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      # The arm64 variant is emulated on the amd64 runner.
      - name: set up qemu
        uses: docker/setup-qemu-action@v4

      - name: log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version stamped with -X main.version, exactly like `make build`:
      # the tag passed by the ci.yaml tag job, or the tag name itself when
      # the workflow was triggered by a hand-pushed tag.
      - name: resolve version
        id: version
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The matching docker tag: the version, sanitised (a hand-made tag may
      # contain characters docker does not accept, e.g. a slash). Keep case
      # folding + invalid-character replacement only: `v1.0.5` must keep its
      # dots.
      - name: compute tag suffix
        id: tag
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          suffix="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g' | sed -E 's#^-+##; s#-+$##')"
          echo "suffix=$suffix"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            matbur/git-prev-branch:latest
            matbur/git-prev-branch:${{ steps.tag.outputs.suffix }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
