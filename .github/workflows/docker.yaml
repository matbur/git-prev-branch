name: docker

# Publishes the Docker Hub image so nobody has to build it themselves
# (README, "Installation -> Docker"). Every merge to main pushes `latest`
# together with `main`; every vX.Y.Z tag pushes the tag name and `latest`.
# Tags are created server-side by `gh release create`, which fires the
# `create` event rather than `push`, so tags are caught here via `create`
# (a real git-pushed tag creates the ref too, so no event is missed). A
# pull request only proves the image still builds.

on:
  push:
    branches: [main]
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and push image
    # Only tag creations matter from `create`; branch/spare refs would run a
    # pointless build. The other events are always wanted.
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    # Serialize publishes per ref: a main push and its follow-up tag creation
    # both write `latest`, so let each finish instead of cancelling a half-done
    # one.
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Newer BuildKit, needed for the multi-platform manifest.
      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      # The arm64 variant is emulated on the amd64 runner.
      - name: set up qemu
        uses: docker/setup-qemu-action@v4

      - name: log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version stamped with -X main.version, exactly like `make build`:
      # the tag name on a tag, git describe otherwise (the tag job creates the
      # new tag only after this merge, so it is not reachable on main yet).
      - name: resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --match 'v[0-9]*' --always)"
          fi
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            matbur/git-prev-branch:latest
            matbur/git-prev-branch:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
