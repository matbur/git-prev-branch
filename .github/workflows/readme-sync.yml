name: readme-sync

# Guards the invariant that README.pl.md stays structurally identical to
# README.md: same headings, same lists and tables, same internal anchors, and
# byte-identical fenced code blocks. Prose is expected to differ -- it is a
# translation. See scripts/check_readme_sync.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-sync:
    name: README.pl.md is in sync with README.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A checker that cannot fail proves nothing, so prove it can first.
      - name: Self-test the checker
        run: python3 scripts/test_check_readme_sync.py

      - name: Check the real files
        run: python3 scripts/check_readme_sync.py